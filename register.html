<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | The Witches Games</title>

  <link rel="stylesheet" href="register.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
  <main class="register-page">

    <a class="brand" href="index.html" aria-label="The Witches Games home">
      <span class="moon">☾</span>
      <span class="brand-small">THE</span>
      <span class="brand-name">WITCHES<br>GAMES</span>
      <span class="star">✦</span>
    </a>

    <div class="ornament"><span></span> ✧ <span></span></div>

    <section class="register-card">
      <div class="card-star">✧</div>

      <h1>JOIN THE COVEN</h1>
      <p class="subtitle">YOUR STORY BEGINS HERE</p>

      <form id="registerForm">
        <label class="input-field">
          <span class="field-icon">♙</span>
          <input type="text" name="username" placeholder="Username"
            aria-label="Username" autocomplete="username"
            minlength="3" maxlength="30" required>
        </label>

        <label class="input-field">
          <span class="field-icon">✉</span>
          <input type="email" name="email" placeholder="Email Address"
            aria-label="Email address" autocomplete="email" required>
        </label>

        <label class="input-field">
          <span class="field-icon">♙</span>
          <input type="password" id="password" name="password"
            placeholder="Create Password" aria-label="Create password"
            autocomplete="new-password" minlength="8" required>
          <button type="button" class="show-password" id="togglePassword"
            aria-label="Show passwords" aria-pressed="false">◉</button>
        </label>

        <label class="input-field">
          <span class="field-icon">♙</span>
          <input type="password" id="confirmPassword" name="confirmPassword"
            placeholder="Confirm Password" aria-label="Confirm password"
            autocomplete="new-password" minlength="8" required>
        </label>

        <label class="terms">
          <input type="checkbox" id="terms" required>
          <span>
            I agree to the
            <a href="terms.html">Terms of Service</a>
            and
            <a href="privacy.html">Privacy Policy</a>.
          </span>
        </label>

        <button type="submit" class="register-button">
          CREATE ACCOUNT
        </button>

        <p id="registerMessage" class="register-message"
          role="status" aria-live="polite"></p>
      </form>

      <div class="divider"><span></span> ✦ <span></span></div>

      <p class="login-text">ALREADY A MEMBER?</p>
      <a href="login.html" class="login-link">RETURN TO LOGIN</a>
    </section>

    <a href="index.html" class="back-home">← RETURN TO THE REALM</a>

    <footer>© THE WITCHES GAMES 2026</footer>
  </main>

  <!-- Load Supabase before your project configuration -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>

  <script>
    const form = document.getElementById("registerForm");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");
    const toggle = document.getElementById("togglePassword");
    const message = document.getElementById("registerMessage");
    const submitButton = form.querySelector('button[type="submit"]');

    toggle.addEventListener("click", () => {
      const show = password.type === "password";
      password.type = show ? "text" : "password";
      confirmPassword.type = show ? "text" : "password";
      toggle.setAttribute("aria-pressed", String(show));
      toggle.setAttribute("aria-label",
        show ? "Hide passwords" : "Show passwords");
    });

    function validatePasswords() {
      confirmPassword.setCustomValidity(
        confirmPassword.value &&
        confirmPassword.value !== password.value
          ? "Passwords do not match."
          : ""
      );
    }

    password.addEventListener("input", validatePasswords);
    confirmPassword.addEventListener("input", validatePasswords);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";

      if (password.value !== confirmPassword.value) {
        message.textContent = "Your passwords do not match.";
        confirmPassword.focus();
        return;
      }

      if (!document.getElementById("terms").checked) {
        message.textContent = "Please agree to the terms to continue.";
        return;
      }

      if (!window.twgSupabase) {
        message.textContent =
          "Supabase is not connected. Check supabase-client.js.";
        console.error("window.twgSupabase is not available.");
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "CREATING ACCOUNT...";

      try {
        const username = form.elements.username.value.trim();
        const email = form.elements.email.value.trim();

        const { data, error } =
          await window.twgSupabase.auth.signUp({
            email: email,
            password: password.value,
            options: {
              data: { username: username },
              emailRedirectTo:
                window.location.origin + "/auth-callback.html"
            }
          });

        if (error) throw error;

if (data.session) {
  window.location.href = "index.html";
} else {
  message.textContent =
    "Account created! Please verify your email. Redirecting to the home page...";

  setTimeout(() => {
    window.location.href = "index.html";
  }, 3000);
}

form.reset();
confirmPassword.setCustomValidity("");
        form.reset();
        confirmPassword.setCustomValidity("");

      } catch (error) {
        console.error("Supabase registration error:", error);
        message.textContent = error.message ||
          "We couldn't create your account. Please try again.";
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "CREATE ACCOUNT";
      }
    });
  </script>
</body>
</html>
